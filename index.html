<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>LinkProxy 官方用户手册 - 工业级算力路由与中转网关</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="LinkProxy Official User Manual & Architecture Guide - High Performance PoW Stratum & EthProxy Mining Gateway.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root {
      --theme-color: #0284c7;
      --sidebar-width: 290px;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .sidebar {
      background-color: #f8fafc;
      border-right: 1px solid #e2e8f0;
    }
    .sidebar-nav strong {
      font-size: 13px;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 15px;
      display: inline-block;
    }
    .app-nav {
      position: fixed;
      margin: 15px 30px 0 0;
      right: 0;
      top: 0;
      z-index: 100;
      font-weight: 600;
    }
    .app-nav a {
      color: #0284c7;
      padding: 6px 12px;
      border-radius: 6px;
      background: #f1f5f9;
      margin-left: 8px;
      text-decoration: none;
      font-size: 13px;
    }
    .app-nav a:hover {
      background: #e2e8f0;
    }
    .markdown-section pre>code {
      font-family: "JetBrains Mono", Consolas, "Fira Code", monospace;
      font-size: 13px;
    }
    .markdown-section table {
      display: table;
      width: 100%;
      border-collapse: collapse;
      margin: 1.5rem 0;
    }
    .markdown-section table th, .markdown-section table td {
      border: 1px solid #e2e8f0;
      padding: 10px 14px;
    }
    .markdown-section table tr:nth-child(2n) {
      background-color: #f8fafc;
    }
    .markdown-section blockquote {
      border-left: 4px solid #38bdf8;
      background: #f0f9ff;
      color: #0369a1;
      padding: 12px 16px;
      border-radius: 0 6px 6px 0;
    }
  </style>
</head>
<body>
  <div id="app">正在加载 LinkProxy 用户手册 / Loading LinkProxy Manual...</div>
  <script>
    window.$docsify = {
      name: 'LinkProxy Manual',
      repo: 'https://github.com/LinkProxy-Core/linkproxy',
      loadSidebar: true,
      loadNavbar: true,
      subMaxLevel: 3,
      auto2top: true,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: {
          '/en/': 'Search manual...',
          '/': '搜索手册内容...'
        },
        noData: {
          '/en/': 'No results found',
          '/': '未找到相关结果'
        },
        depth: 4
      },
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied'
      }
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-go.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-ini.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-powershell.min.js"></script>
</body>
</html>
