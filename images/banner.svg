<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" fill="url(#bg-grad)" rx="16" />

  <!-- Ambient Glow -->
  <circle cx="200" cy="80" r="180" fill="url(#glow-grad)" />
  <circle cx="1050" cy="280" r="160" fill="url(#glow-grad)" />

  <!-- Cyber Grid Lines -->
  <path d="M 0 100 L 1200 100 M 0 200 L 1200 200 M 0 300 L 1200 300" stroke="#1E293B" stroke-width="1" stroke-dasharray="6,6" opacity="0.4" />
  <path d="M 200 0 L 200 360 M 400 0 L 400 360 M 600 0 L 600 360 M 800 0 L 800 360 M 1000 0 L 1000 360" stroke="#1E293B" stroke-width="1" stroke-dasharray="6,6" opacity="0.4" />

  <!-- Main Logo Node Icon -->
  <g transform="translate(100, 110)">
    <polygon points="70,10 130,45 130,115 70,150 10,115 10,45" fill="#111827" stroke="url(#accent-cyan)" stroke-width="3" filter="url(#glow)" />
    <circle cx="70" cy="80" r="28" fill="#06B6D4" opacity="0.15" />
    <circle cx="70" cy="80" r="16" fill="url(#accent-cyan)" />
    <!-- Dynamic Rings -->
    <circle cx="70" cy="80" r="42" fill="none" stroke="#06B6D4" stroke-width="1.5" stroke-dasharray="5,8" />
  </g>

  <!-- Title & Subtitle -->
  <text x="270" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="#FFFFFF" letter-spacing="1">
    Link<tspan fill="url(#accent-cyan)">Proxy</tspan>
  </text>
  <text x="275" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#94A3B8" letter-spacing="0.5">
    Next-Gen Stratum &amp; EthProxy High-Performance Mining Gateway
  </text>
  <text x="275" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#64748B">
    万台高并发 · 零漏报转发 · 毫秒级防抖 · 混淆加密中转 · 深度硬件兼容 (BTC / LTC / KAS / ETC / PRL / QTC)
  </text>

  <!-- Tags / Badges -->
  <g transform="translate(275, 275)">
    <rect x="0" y="0" width="125" height="32" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="62" y="21" font-family="monospace" font-size="13" font-weight="bold" fill="#06B6D4" text-anchor="middle">1:1 Stratum</text>

    <rect x="135" y="0" width="135" height="32" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="202" y="21" font-family="monospace" font-size="13" font-weight="bold" fill="#10B981" text-anchor="middle">Zero Latency</text>

    <rect x="280" y="0" width="145" height="32" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="352" y="21" font-family="monospace" font-size="13" font-weight="bold" fill="#F59E0B" text-anchor="middle">Encrypted Tunnel</text>

    <rect x="435" y="0" width="120" height="32" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="495" y="21" font-family="monospace" font-size="13" font-weight="bold" fill="#8B5CF6" text-anchor="middle">Multi-Coin</text>
  </g>
</svg>
